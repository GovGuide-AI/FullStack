  note:
    en: >-
      Compiled from official sources but not checked by a person. Most of the
      document detail comes from the MoFED tax compliance guide, which is
      written for foreign investors; a reviewer should confirm each item applies
      to a wholly domestic PLC. MoTRI's requirement list does not separate
      organisations from individuals, so the split between this record and the
      sole proprietor one is editorial. Proclamation 980/2016 is cited for the
      TIN mechanism only: it is amended by Proclamation 1150/2019, whose scan
      does not carry an extractable text layer, so the amendment has not been
      read against it. No fees are stated because none are published.
    am: >-
      ከኦፊሴላዊ ምንጮች የተዘጋጀ ቢሆንም በሰው አልተረጋገጠም። አብዛኛው የሰነድ ዝርዝር
      ለውጭ ባለሀብቶች ከተጻፈው የገንዘብ ሚኒስቴር መመሪያ የተወሰደ ነው፤ ገምጋሚው
      እያንዳንዱ ነጥብ ሙሉ በሙሉ የአገር ውስጥ በሆነ የግል ማኅበር ላይ ተፈጻሚ መሆኑን
      ማረጋገጥ አለበት። የሚኒስቴሩ የመስፈርት ዝርዝር ድርጅቶችንና ግለሰቦችን ስለማይለይ
      በዚህና በግል ነጋዴው መዝገብ መካከል ያለው ክፍፍል የአርትዖት ውሳኔ ነው። አዋጅ
      980/2016 የተጠቀሰው ለቲን አሠራሩ ብቻ ነው፤ በአዋጅ 1150/2019 የተሻሻለ ሲሆን
      የዚያኛው ቅጂ ሊነበብ የሚችል የጽሑፍ ሽፋን ስለሌለው ማሻሻያው አልተነጻጸረም።
      ክፍያ አልተገለጸም ምክንያቱም የታተመ የለም።
