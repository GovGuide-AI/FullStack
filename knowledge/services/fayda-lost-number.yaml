  note:
    en: >-
      Compiled from NIDP pages but not checked by a person. Two things a
      reviewer should settle. The card printing fee is chargeable but NIDP
      publishes no amount, so this record records it as variable rather than
      quoting a figure from elsewhere. And NIDP describes no concept of an
      expired Fayda number — the number is permanent — so a citizen asking about
      an "expired national ID" most likely needs either a card reprint, covered
      here, or a details update, covered by fayda-update-details.
    am: >-
      ከብሔራዊ መታወቂያ ፕሮግራም ገጾች የተዘጋጀ ቢሆንም በሰው አልተረጋገጠም። ገምጋሚ
      ሊፈታቸው የሚገቡ ሁለት ነጥቦች አሉ። የካርድ ኅትመት ክፍያ ያለው ቢሆንም
      ፕሮግራሙ መጠኑን ስላላተመ ይህ መዝገብ ከሌላ ቦታ ቁጥር ከመጥቀስ ይልቅ
      እንደሚለዋወጥ መዝግቦታል። እንዲሁም ፕሮግራሙ ጊዜው ስለሚያልፍ የፋይዳ ቁጥር
      አይናገርም — ቁጥሩ ቋሚ ነው — ስለዚህ ስለ "ጊዜው ስላለፈ ብሔራዊ መታወቂያ"
      የሚጠይቅ ዜጋ በዚህ የተሸፈነውን የካርድ ድጋሚ ኅትመት ወይም በfayda-update-details
      የተሸፈነውን የመረጃ ዝማኔ ሳይፈልግ አይቀርም።
