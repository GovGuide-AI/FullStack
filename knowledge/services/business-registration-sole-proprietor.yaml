  note:
    en: >-
      Compiled from official sources but not checked by a person. Three caveats
      a reviewer must resolve. First, MoTRI publishes one requirement list for
      individuals and organisations together; splitting it by legal form is our
      editorial judgement, not MoTRI's. Second, the MoFED guide is written for
      foreign investors, so items taken from it may not bind an Ethiopian sole
      trader. Third, MoTRI publishes no fees and no processing times, and this
      record deliberately states none rather than borrowing figures from
      unofficial sites.
    am: >-
      ከኦፊሴላዊ ምንጮች የተዘጋጀ ቢሆንም በሰው አልተረጋገጠም። ገምጋሚ ሊፈታቸው
      የሚገቡ ሦስት ጉዳዮች አሉ። አንደኛ፣ ንግድና ቀጣናዊ ትስስር ሚኒስቴር ለግለሰቦችና
      ለድርጅቶች አንድ ዓይነት የመስፈርት ዝርዝር ያትማል፤ በሕጋዊ ቅርጽ መከፋፈሉ
      የእኛ የአርትዖት ውሳኔ እንጂ የሚኒስቴሩ አይደለም። ሁለተኛ፣ የገንዘብ ሚኒስቴር
      መመሪያ ለውጭ ባለሀብቶች የተጻፈ በመሆኑ ከዚያ የተወሰዱ ነጥቦች በኢትዮጵያዊ
      የግል ነጋዴ ላይ ላይሠሩ ይችላሉ። ሦስተኛ፣ ሚኒስቴሩ ክፍያንም ሆነ የሚፈጀውን ጊዜ
      ስላላተመ ይህ መዝገብ ከኦፊሴላዊ ካልሆኑ ድረ-ገጾች ቁጥር ከመዋስ ይልቅ ምንም
      አለመግለጽን መርጧል።
