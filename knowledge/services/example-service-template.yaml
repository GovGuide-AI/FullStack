# TEMPLATE RECORD — NOT REAL GOVERNMENT GUIDANCE
#
# This file exists so the schema, loader, router, and UI have something to run
# against. Every value below is placeholder text that says so out loud. No real
# Ethiopian government service, fee, office, or processing time is described
# here, because none had been verified against an official source at the time
# this record was written.
#
# To add a real service: copy this file, rename it to <slug>.yaml, replace every
# field with information taken from an official source, list those sources under
# verification.sourceUrls, and only then set verification.verified to true.
#
# The Amharic strings below are placeholder copy and should be reviewed by a
# native speaker before any real record ships.

